<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Angiogenesis network schematic</title>
  <desc id="desc">A schematic dark tube network with a dashed usable region of interest and centerline skeleton.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8eef3"/>
      <stop offset="1" stop-color="#cfd8e2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="240" ry="130" fill="#0f766e" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="915" cy="430" rx="260" ry="150" fill="#b45309" opacity="0.12" filter="url(#soft)"/>
  <rect x="95" y="80" width="1010" height="515" rx="38" fill="none" stroke="#b45309" stroke-width="10" stroke-dasharray="28 20" opacity="0.82"/>
  <g fill="none" stroke="#111827" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 420 C240 360, 340 372, 470 318 S720 258, 850 180 S1040 120, 1110 90"/>
    <path d="M470 318 C420 235, 370 185, 310 110"/>
    <path d="M645 278 C690 370, 760 430, 900 505"/>
    <path d="M850 180 C890 270, 945 330, 1060 375"/>
  </g>
  <g fill="none" stroke="#0891b2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 420 C240 360, 340 372, 470 318 S720 258, 850 180 S1040 120, 1110 90"/>
    <path d="M470 318 C420 235, 370 185, 310 110"/>
    <path d="M645 278 C690 370, 760 430, 900 505"/>
    <path d="M850 180 C890 270, 945 330, 1060 375"/>
  </g>
  <g fill="#111827">
    <circle cx="470" cy="318" r="28"/>
    <circle cx="645" cy="278" r="24"/>
    <circle cx="850" cy="180" r="26"/>
  </g>
  <text x="100" y="636" fill="#17202a" font-family="Arial, sans-serif" font-size="30" font-weight="700">network mask + usable ROI + skeleton</text>
</svg>
