<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Alveolar morphometry schematic</title>
  <desc id="desc">A schematic set of alveolar airspaces with grid lines and a thickness heatmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f5f7"/>
      <stop offset="1" stop-color="#d7e0e8"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" x2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.35" stop-color="#5eead4"/>
      <stop offset="0.68" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="92" y="92" width="1016" height="490" rx="34" fill="url(#heat)" opacity="0.22"/>
  <g stroke="#b45309" stroke-width="5" opacity="0.65">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="335" x2="1200" y2="335"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="245" y1="0" x2="245" y2="675"/>
    <line x1="555" y1="0" x2="555" y2="675"/>
    <line x1="865" y1="0" x2="865" y2="675"/>
  </g>
  <g fill="#f8fafc" stroke="#111827" stroke-width="18">
    <path d="M135 210 C150 120, 275 105, 360 150 C442 194, 410 308, 320 344 C235 378, 120 318, 135 210Z"/>
    <path d="M470 170 C540 82, 735 108, 770 220 C810 350, 650 420, 535 365 C430 315, 392 270, 470 170Z"/>
    <path d="M820 155 C905 70, 1065 120, 1085 245 C1105 370, 960 430, 855 350 C770 285, 740 235, 820 155Z"/>
    <path d="M215 445 C250 365, 390 370, 440 450 C495 540, 390 615, 285 590 C205 570, 175 515, 215 445Z"/>
    <path d="M650 455 C700 375, 870 400, 910 500 C950 600, 825 650, 730 612 C640 575, 600 532, 650 455Z"/>
  </g>
  <g fill="#0f766e" font-family="Arial, sans-serif" font-weight="700" font-size="34">
